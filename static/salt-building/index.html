<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Salt Building 3D</title><style>html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui}#msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}</style></head><body><div id="msg">Loading Al-Salt 3D model…</div><script>
(async()=>{try{const parts=await Promise.all([0,1,2].map(i=>fetch(`./v10s/p${i}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`chunk ${i}: HTTP ${r.status}`);return r.text()})));const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').innerHTML='Could not load the 3D model.<br>'+e.message}})();
</script></body></html>
