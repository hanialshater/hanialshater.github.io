<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Salt Building 3D</title><style>html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui}#msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}</style></head><body><div id="msg">Loading Al-Salt 3D model…</div><script>
(async()=>{try{
 const MODEL='https://raw.githubusercontent.com/hanialshater/hanialshater.github.io/main/salt-building/index.html';
 const BG_SOURCE='https://raw.githubusercontent.com/hanialshater/hanialshater.github.io/391c3dc3ba69c0e326e47e5808a3588dfc61cd3e/static/salt-building/index.html';
 const [model,bgSource]=await Promise.all([
   fetch(MODEL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('model '+r.status);return r.text()}),
   fetch(BG_SOURCE,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('background '+r.status);return r.text()})
 ]);
 const match=bgSource.match(/const SITE_BG='([^']+)'/);
 if(!match) throw new Error('site background not found');
 const siteBg=match[1];
 let html=model;
 // Keep the existing model. These are targeted patches only.
 html=html.replace(`#ui{position:absolute;top:12px;left:12px;max-width:330px;background:rgba(18,24,28,.88);color:#eef4f6;padding:12px;border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.22)}`,`#ui{position:absolute;top:0;left:0;bottom:0;width:300px;max-width:300px;background:rgba(18,24,28,.92);color:#eef4f6;padding:14px;border-radius:0 12px 12px 0;overflow:auto;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.22);z-index:10}`);
 html=html.replace(`@media(max-width:760px){#ui{max-width:calc(100vw - 24px);padding:9px}`,`@media(max-width:760px){#ui{width:250px;max-width:72vw;padding:9px}`);
 html=html.replace(`input[type=range]{width:120px}`,`input[type=range]{width:120px}select{background:#253038;color:#edf4f7;border:1px solid #52626a;border-radius:7px;padding:6px;max-width:135px}`);
 html=html.replace(`<div class="row"><label>Actual site background</label><input id="bg" type="checkbox" disabled></div>`,`<div class="row"><label>Actual site background</label><input id="bg" type="checkbox" checked></div>`);
 html=html.replace(`<div class="row"><label>Garage & retaining walls</label><input id="garage" type="checkbox" checked></div>`,`<div class="row"><label>Garage & retaining walls</label><input id="garage" type="checkbox" checked></div><div class="row"><label>Inspect floor</label><select id="floorInspect"><option value="-1">Whole building</option><option value="0">-1 / Semi-ground</option><option value="1">GF</option><option value="2">Floor 1</option><option value="3">Floor 2</option><option value="4">Floor 3</option></select></div>`);
 const bgLiteral=JSON.stringify(siteBg);
 html=html.replace(`const scene=new THREE.Scene();scene.background=new THREE.Color(0xcadbe5);scene.fog=new THREE.Fog(0xcadbe5,70,145);`,`const scene=new THREE.Scene();const bgColor=new THREE.Color(0xcadbe5);const bgTexture=new THREE.TextureLoader().load(${bgLiteral},()=>{bgTexture.colorSpace=THREE.SRGBColorSpace;if(document.getElementById('bg')?.checked)scene.background=bgTexture;});scene.background=bgColor;scene.fog=new THREE.Fog(0xcadbe5,70,145);`);
 // Correct the side-window orientation without changing facade positions.
 html=html.replace(`box(g,'side glass',.055,1.45,1.55,wx,cy,z,mats.glass,0,Math.PI/2);box(g,'side glass',.055,1.45,1.55,-wx,cy,z,mats.glass,0,Math.PI/2)`,`box(g,'side glass',.055,1.55,1.80,wx,cy-.125,z,mats.glass,0,Math.PI/2);box(g,'side glass',.055,1.55,1.80,-wx,cy-.125,z,mats.glass,0,Math.PI/2)`);
 // Semi-ground (-1) terraces: floor level ~2.84m, upper street ~5.88m => ~3.04m below street.
 html=html.replace(`box(roots.site,'left garden terrace',8.6,.32,4.4,-7.0,3.0,-9.3,mats.terrace);box(roots.site,'right garden terrace',8.6,.32,4.4,7.0,3.0,-9.3,mats.terrace);for(const x of [-10,-7.5,-5,5,7.5,10]){box(roots.site,'tree trunk',.18,1.8,.18,x,4.0,-10.3,mats.frame);const crown=new THREE.Mesh(new THREE.SphereGeometry(.7,10,8),mats.green);crown.position.set(x,5.1,-10.3);roots.site.add(crown)}`,`const semiTerraces=new THREE.Group();semiTerraces.name='semi-ground terraces';roots.site.add(semiTerraces);box(semiTerraces,'left -1 terrace',8.6,.24,4.4,-7.0,2.84,-9.3,mats.terrace);box(semiTerraces,'right -1 terrace',8.6,.24,4.4,7.0,2.84,-9.3,mats.terrace);box(semiTerraces,'left terrace outer retaining',.28,3.05,4.4,-11.18,4.34,-9.3,mats.stone);box(semiTerraces,'right terrace outer retaining',.28,3.05,4.4,11.18,4.34,-9.3,mats.stone);rail(semiTerraces,-7.0,2.96,-11.45,8.25,.12);rail(semiTerraces,7.0,2.96,-11.45,8.25,.12);for(const x of [-10,-7.5,-5,5,7.5,10]){box(roots.site,'tree trunk',.18,1.8,.18,x,2.9,-13.0,mats.frame);const crown=new THREE.Mesh(new THREE.SphereGeometry(.7,10,8),mats.green);crown.position.set(x,4.0,-13.0);roots.site.add(crown)}`);
 // Keep the cars previously requested.
 html=html.replace(`box(roots.garage,'garage back wall',W,2.85,.28,0,1.43,backZ+.14,mats.stone);box(roots.garage,'garage door',.07,2.45,4.3,-W/2-.04,1.25,-3.4,mats.frame,0,Math.PI/2);`,`box(roots.garage,'garage back wall',W,2.85,.28,0,1.43,backZ+.14,mats.stone);box(roots.garage,'garage door',.07,2.45,4.3,-W/2-.04,1.25,-3.4,mats.frame,0,Math.PI/2);function addCar(x,z,c=0x536b78){const car=new THREE.Group();const cm=new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.25}),gm=new THREE.MeshPhysicalMaterial({color:0x607d8b,roughness:.2,transparent:true,opacity:.82}),wm=new THREE.MeshStandardMaterial({color:0x16191b,roughness:.9});box(car,'car body',1.82,.48,4.15,0,.42,0,cm);box(car,'car cabin',1.48,.52,2.0,0,.82,.05,gm);for(const xx of [-.82,.82])for(const zz of [-1.27,1.27]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.17,14),wm);wh.rotation.z=Math.PI/2;wh.position.set(xx,.28,zz);car.add(wh)}car.position.set(x,0,z);roots.garage.add(car)}[-9,-5,-1,3,7].forEach((x,i)=>addCar(x,i%2?2.4:-2.2,[0x526d82,0x7a746b,0x39434a,0x8a8f92,0x5c665e][i]));`);
 // Floor inspection remains lightweight; selecting a floor cancels explode and hides floating balconies.
 html=html.replace(`const exp=document.getElementById('explode'),ev=document.getElementById('ev');`,`const ghostStone=new THREE.MeshStandardMaterial({color:0xf4f1e9,roughness:.9,transparent:true,opacity:.16,depthWrite:false,side:THREE.DoubleSide});const exp=document.getElementById('explode'),ev=document.getElementById('ev');`);
 html=html.replace(`document.getElementById('bg').onchange=e=>{};`,`document.getElementById('bg').onchange=e=>{scene.background=e.target.checked?bgTexture:bgColor;};`);
 html=html.replace(`function view(name){`,`function restoreFloorInspect(){groups.forEach(g=>{g.visible=true;const sh=g.children.find(o=>o.name==='shell');if(sh)sh.material=document.getElementById('stone').checked?mats.stone:mats.plainStone;});roots.roof.visible=true;roots.balconies.visible=document.getElementById('bal').checked;}const floorInspect=document.getElementById('floorInspect');floorInspect.onchange=()=>{restoreFloorInspect();const idx=+floorInspect.value;if(idx<0)return;exp.value=0;applyExplode();groups.forEach((g,i)=>g.visible=i<=idx);roots.roof.visible=false;roots.balconies.visible=false;const sh=groups[idx].children.find(o=>o.name==='shell');if(sh)sh.material=ghostStone;camera.position.set(26,baseYs[idx]+15,24);controls.target.set(0,baseYs[idx]+1.2,0);controls.update();};function view(name){`);
 html=html.replace(`if(name==='reset'){roots.roof.visible=true;exp.value=0;applyExplode();set([31,24,37],[0,8,0])}`,`if(name==='reset'){floorInspect.value='-1';restoreFloorInspect();exp.value=0;applyExplode();set([31,24,37],[0,8,0])}`);
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('msg').innerHTML='Could not load the 3D model.<br><small>'+e.message+'</small>'}
})();
</script></body></html>
