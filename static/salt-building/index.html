<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al-Salt Building 3D</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui}
#msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
</style></head>
<body><div id="msg">Loading Al-Salt 3D model…</div>
<script>
(async()=>{try{
  const MODEL='https://raw.githubusercontent.com/hanialshater/hanialshater.github.io/main/salt-building/index.html';
  const BG_SOURCE='https://raw.githubusercontent.com/hanialshater/hanialshater.github.io/391c3dc3ba69c0e326e47e5808a3588dfc61cd3e/static/salt-building/index.html';
  const [html0,bgSource]=await Promise.all([
    fetch(MODEL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('model '+r.status);return r.text()}),
    fetch(BG_SOURCE,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('background '+r.status);return r.text()})
  ]);
  const match=bgSource.match(/const SITE_BG='([^']+)'/);
  if(!match) throw new Error('site background not found');
  const siteBg=match[1];
  let html=html0;
  html=html.replace(`#ui{position:absolute;top:12px;left:12px;max-width:330px;background:rgba(18,24,28,.88);color:#eef4f6;padding:12px;border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.22)}`,`#ui{position:absolute;top:0;left:0;bottom:0;width:300px;max-width:300px;background:rgba(18,24,28,.92);color:#eef4f6;padding:14px;border-radius:0 12px 12px 0;overflow:auto;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.22);z-index:10}`);
  html=html.replace(`@media(max-width:760px){#ui{max-width:calc(100vw - 24px);padding:9px}`,`@media(max-width:760px){#ui{width:250px;max-width:72vw;padding:9px}`);
  html=html.replace(`input[type=range]{width:120px}`,`input[type=range]{width:120px}select{background:#253038;color:#edf4f7;border:1px solid #52626a;border-radius:7px;padding:6px;max-width:150px}`);
  html=html.replace(`<div class="row"><label>Actual site background</label><input id="bg" type="checkbox" disabled></div>`,`<div class="row"><label>Actual site background</label><input id="bg" type="checkbox" checked></div>`);
  html=html.replace(`<div class="row"><label>Garage & retaining walls</label><input id="garage" type="checkbox" checked></div>`,`<div class="row"><label>Garage & retaining walls</label><input id="garage" type="checkbox" checked></div><div class="row"><label>Inspect floor</label><select id="floorInspect"><option value="-1">Whole building</option><option value="0">-1 / Semi-ground</option><option value="1">GF</option><option value="2">Floor 1</option><option value="3">Floor 2</option><option value="4">Floor 3</option></select></div>`);
  html=html.replace(`const scene=new THREE.Scene();scene.background=new THREE.Color(0xcadbe5);scene.fog=new THREE.Fog(0xcadbe5,70,145);`,`const scene=new THREE.Scene();const bgColor=new THREE.Color(0xcadbe5);const bgTexture=new THREE.TextureLoader().load(${JSON.stringify(siteBg)},t=>{t.colorSpace=THREE.SRGBColorSpace;scene.background=t;});scene.background=bgColor;scene.fog=new THREE.Fog(0xcadbe5,70,145);`);
  html=html.replace(`box(g,'side glass',.055,1.45,1.55,wx,cy,z,mats.glass,0,Math.PI/2);box(g,'side glass',.055,1.45,1.55,-wx,cy,z,mats.glass,0,Math.PI/2)`,`box(g,'side glass',.055,1.55,1.80,wx,cy-.125,z,mats.glass,0,Math.PI/2);box(g,'side glass',.055,1.55,1.80,-wx,cy-.125,z,mats.glass,0,Math.PI/2)`);
  html=html.replace(`for(const z of [-3.4,1.6,4.6]){const wx=-W/2-.032;box(g,'side glass',.055,1.45,1.55,wx,cy,z,mats.glass,0,Math.PI/2);box(g,'side glass',.055,1.45,1.55,-wx,cy,z,mats.glass,0,Math.PI/2)}});\nbox(roots.site,'entrance bridge'`,`for(const z of [-3.4,1.6,4.6]){const wx=-W/2-.032;box(g,'side glass',.055,1.55,1.80,wx,cy-.125,z,mats.glass,0,Math.PI/2);box(g,'side glass',.055,1.55,1.80,-wx,cy-.125,z,mats.glass,0,Math.PI/2)}});\nconst interiorMat=new THREE.MeshStandardMaterial({color:0xf1eee6,roughness:.96});function wallX(g,x,z,len,y){return box(g,'interior wall',len,2.45,.12,x,y,z,interiorMat)}function wallZ(g,x,z,len,y){return box(g,'interior wall',.12,2.45,len,x,y,z,interiorMat)}groups.forEach((g,i)=>{const y=baseYs[i]+1.35;wallZ(g,-1.65,3.55,6.9,y);wallZ(g,1.65,3.55,6.9,y);wallX(g,0,0.15,3.3,y);for(const s of [-1,1]){wallZ(g,s*6.55,3.95,5.7,y);wallX(g,s*8.95,1.15,4.75,y);wallX(g,s*5.15,1.15,2.75,y);wallZ(g,s*3.25,3.75,4.5,y);wallZ(g,s*2.45,-0.15,2.9,y);wallX(g,s*3.15,-1.55,1.55,y);wallX(g,s*3.15,0.55,1.55,y);wallZ(g,s*6.75,-3.85,5.5,y);wallX(g,s*8.75,-1.35,4.0,y);wallX(g,s*4.55,-1.35,3.25,y);}});\nbox(roots.site,'entrance bridge'`);
  html=html.replace(`box(roots.site,'left garden terrace',8.6,.32,4.4,-7.0,3.0,-9.3,mats.terrace);box(roots.site,'right garden terrace',8.6,.32,4.4,7.0,3.0,-9.3,mats.terrace);`,`box(roots.site,'left garden terrace',9.4,.28,4.7,-6.7,2.98,-9.45,mats.terrace);box(roots.site,'right garden terrace',9.4,.28,4.7,6.7,2.98,-9.45,mats.terrace);box(roots.site,'left terrace retaining',.22,2.85,4.7,-11.42,4.35,-9.45,mats.stone);box(roots.site,'right terrace retaining',.22,2.85,4.7,11.42,4.35,-9.45,mats.stone);rail(roots.site,-6.7,3.10,-11.78,9.4,.18);rail(roots.site,6.7,3.10,-11.78,9.4,.18);`);
  html=html.replace(`document.getElementById('bg').onchange=e=>{};`,`document.getElementById('bg').onchange=e=>{scene.background=e.target.checked?bgTexture:bgColor;};`);
  html=html.replace(`function view(name){`,`const floorInspect=document.getElementById('floorInspect');const shellMaterial=()=>document.getElementById('stone').checked?mats.stone:mats.plainStone;function setSiteCoverVisible(v){roots.site.children.forEach(o=>{if(['upper street','front sidewalk','entrance bridge','main entrance door'].includes(o.name))o.visible=v;});}function restoreFloorInspect(){groups.forEach(g=>{g.visible=true;const sh=g.children.find(o=>o.name==='shell');if(sh){sh.visible=true;sh.material=shellMaterial();}});roots.roof.visible=true;roots.balconies.visible=document.getElementById('bal').checked;setSiteCoverVisible(true);}floorInspect.onchange=()=>{restoreFloorInspect();const idx=+floorInspect.value;if(idx<0)return;exp.value=0;applyExplode();groups.forEach((g,i)=>g.visible=i===idx);roots.roof.visible=false;roots.balconies.visible=false;const sh=groups[idx].children.find(o=>o.name==='shell');if(sh)sh.visible=false;if(idx===0)setSiteCoverVisible(false);const y=baseYs[idx]+1.0;if(idx===0){camera.position.set(27,y+13,-28);controls.target.set(0,y,-2.5);}else{camera.position.set(27,y+14,-25);controls.target.set(0,y,-1);}controls.update();};function view(name){`);
  html=html.replace(`if(name==='reset'){roots.roof.visible=true;exp.value=0;applyExplode();set([31,24,37],[0,8,0])}`,`if(name==='reset'){floorInspect.value='-1';restoreFloorInspect();exp.value=0;applyExplode();set([31,24,37],[0,8,0])}`);
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('msg').innerHTML='Could not load the 3D model.<br><small>'+e.message+'</small>'}
})();
</script></body></html>
